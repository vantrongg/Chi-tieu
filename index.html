<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Quản lý chi tiêu</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512.PNG">

  <meta name="theme-color" content="#111827">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f3f4f6;
      color: #111827;
      padding-bottom: 90px;
    }

    .app {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    /* HEADER */

    .header {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .title {
      font-size: 26px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 15px;
      color: #6b7280;
      font-weight: 600;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .card-title {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .card-value {
      font-size: 20px;
      font-weight: 800;
    }

    /* SEARCH */

    .search-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #111827;
    }

    input:focus {
      border-color: #6366f1;
    }

    /* ADD */

    .add-box {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .hint {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn {
      width: 100%;
      margin-top: 10px;
      background: #111827;
      color: white;
    }

    /* TABLE */

    .history {
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
      margin-bottom: 14px;
    }

    .history-header {
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th {
      background: #f9fafb;
      text-align: left;
      font-size: 13px;
      color: #6b7280;
      padding: 12px;
    }

    td {
      padding: 13px 12px;
      border-top: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .amount {
      font-weight: 800;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      padding: 7px 10px;
    }

    .empty {
      padding: 30px 15px;
      text-align: center;
      color: #9ca3af;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;

      background: rgba(255,255,255,.96);
      border-top: 1px solid #e5e7eb;

      display: flex;
      justify-content: center;
      gap: 8px;

      padding:
        10px
        max(10px, env(safe-area-inset-bottom));
    }

    .nav-btn {
      background: transparent;
      color: #6b7280;
      min-width: 90px;
    }

    .nav-btn.active {
      color: #111827;
      background: #f3f4f6;
    }

    /* MODAL */

    .modal {
      display: none;

      position: fixed;
      inset: 0;
      z-index: 200;

      background: rgba(0,0,0,.5);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 500px;

      background: #ffffff;
      border-radius: 20px;

      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .setting-row {
      margin-bottom: 14px;
    }

    .setting-row label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .setting-buttons {
      display: grid;
      gap: 10px;
    }

    .backup {
      background: #eef2ff;
      color: #3730a3;
    }

    .restore {
      background: #ecfdf5;
      color: #047857;
    }

    .csv {
      background: #fff7ed;
      color: #c2410c;
    }

    .dark-btn {
      background: #111827;
      color: white;
    }

    .close-btn {
      width: 100%;
      margin-top: 10px;
      background: #e5e7eb;
    }

    /* DARK MODE */

    body.dark {
      background: #0f172a;
      color: #f8fafc;
    }

    body.dark .header,
    body.dark .card,
    body.dark .search-box,
    body.dark .add-box,
    body.dark .history,
    body.dark .modal-content {
      background: #1e293b;
      color: #f8fafc;
    }

    body.dark input {
      background: #0f172a;
      color: white;
      border-color: #475569;
    }

    body.dark th {
      background: #172033;
    }

    body.dark td {
      border-color: #334155;
    }

    body.dark .subtitle,
    body.dark .card-title,
    body.dark .hint {
      color: #94a3b8;
    }

    body.dark .bottom-nav {
      background: rgba(15,23,42,.96);
      border-color: #334155;
    }

    body.dark .nav-btn.active {
      background: #334155;
      color: white;
    }

    body.dark .close-btn {
      background: #334155;
      color: white;
    }

    /* MOBILE */

    @media (max-width: 650px) {

      .app {
        padding: 10px;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .card-value {
        font-size: 18px;
      }

      .title {
        font-size: 23px;
      }

      .bottom-nav {
        gap: 2px;
      }

      .nav-btn {
        min-width: 75px;
        padding: 10px 7px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="title">
      💰 Quản lý chi tiêu
    </div>

    <div
      class="subtitle"
      id="currentDate">
    </div>

  </div>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="card">
      <div class="card-title">
        🌅 Hôm nay
      </div>

      <div
        class="card-value"
        id="todayTotal">
        0đ
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        🗓️ Tháng này
      </div>

      <div
        class="card-value"
        id="monthTotal">
        0đ
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        📊 Năm nay
      </div>

      <div
        class="card-value"
        id="yearTotal">
        0đ
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        🎯 Ngân sách
      </div>

      <div
        class="card-value"
        id="budgetTotal">
        Chưa đặt
      </div>
    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <div class="section-title">
      🔎 Tìm khoản chi
    </div>

    <input
      type="text"
      id="searchInput"
      placeholder="Ví dụ: ăn sáng, xăng, cà phê..."
      oninput="render()"
    >

  </div>


  <!-- ADD EXPENSE -->

  <div class="add-box">

    <div class="section-title">
      ➕ Thêm khoản chi
    </div>

    <input
      type="text"
      id="expenseInput"
      placeholder="Ví dụ: 50k ăn sáng"
      onkeydown="if(event.key==='Enter') addExpense()"
    >

    <button
      class="add-btn"
      onclick="addExpense()">
      ➕ Thêm khoản chi
    </button>

    <div class="hint">
      Ví dụ:
      <b>50k ăn sáng</b> ·
      <b>100k xăng</b> ·
      <b>35k cà phê</b> ·
      <b>1.5tr mua đồ</b> ·
      <b>2 triệu tiền nhà</b>
    </div>

  </div>


  <!-- HISTORY -->

  <div class="history">

    <div class="history-header">
      📋 Chi tiêu gần đây
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>

            <th>
              🧾 Khoản chi
            </th>

            <th>
              🏷️ Loại
            </th>

            <th>
              💵 Số tiền
            </th>

            <th>
              🕐 Giờ
            </th>

            <th>
              🗑️
            </th>

          </tr>
        </thead>

        <tbody id="expenseList"></tbody>

      </table>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="showDashboard()">
    🏠 Tổng quan
  </button>

  <button
    class="nav-btn"
    onclick="showHistory()">
    🧾 Lịch sử
  </button>

  <button
    class="nav-btn"
    onclick="openSettings()">
    ⚙️ Cài đặt
  </button>

</div>


<!-- SETTINGS MODAL -->

<div
  class="modal"
  id="settingsModal"
  onclick="if(event.target===this) closeSettings()">

  <div class="modal-content">

    <div class="modal-title">
      ⚙️ Cài đặt
    </div>


    <!-- BUDGET -->

    <div class="setting-row">

      <label>
        🎯 Ngân sách tháng
      </label>

      <input
        type="number"
        id="budgetInput"
        placeholder="Ví dụ: 10000000"
      >

      <button
        style="width:100%;margin-top:8px"
        onclick="saveBudget()">
        💾 Lưu ngân sách
      </button>

    </div>


    <!-- BACKUP -->

    <div class="setting-buttons">

      <button
        class="backup"
        onclick="backupData()">
        💾 Sao lưu dữ liệu
      </button>


      <button
        class="restore"
        onclick="document.getElementById('restoreFile').click()">
        ♻️ Khôi phục dữ liệu
      </button>

      <input
        type="file"
        id="restoreFile"
        accept=".json"
        style="display:none"
        onchange="restoreData(event)"
      >


      <button
        class="csv"
        onclick="exportCSV()">
        📤 Xuất CSV
      </button>


      <button
        class="dark-btn"
        onclick="toggleDarkMode()">
        🌙 Đổi giao diện sáng / tối
      </button>

    </div>


    <button
      class="close-btn"
      onclick="closeSettings()">
      ✖️ Đóng
    </button>

  </div>

</div>


<script>

  /* =========================
     STORAGE
  ========================= */

  const STORAGE_KEY = "chi_tieu_v1";

  const BUDGET_KEY = "chi_tieu_budget";


  let expenses =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );


  let budget =
    Number(
      localStorage.getItem(BUDGET_KEY) || 0
    );


  /* =========================
     FORMAT MONEY
  ========================= */

  function formatMoney(number) {

    return new Intl.NumberFormat(
      "vi-VN"
    ).format(number) + "đ";

  }


  /* =========================
     CURRENT DATE
  ========================= */

  function updateDate() {

    const now = new Date();

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");


    const year =
      now.getFullYear();


    document.getElementById(
      "currentDate"
    ).textContent =
      "📅 " +
      day +
      "/" +
      month +
      "/" +
      year;

  }


  /* =========================
     PARSE AMOUNT
  ========================= */

  function parseAmount(text) {

    let match =
      text.match(
        /(\d+(?:[.,]\d+)?)\s*(k|nghìn|ngàn|tr|triệu|đ)?/i
      );


    if (!match) return 0;


    let numberText =
      match[1];


    let unit =
      (match[2] || "").toLowerCase();


    let number;


    if (
      !unit &&
      /^\d{1,3}([.,]\d{3})+$/.test(
        numberText
      )
    ) {

      number =
        Number(
          numberText.replace(
            /[.,]/g,
            ""
          )
        );

    } else {

      number =
        Number(
          numberText.replace(
            ",",
            "."
          )
        );

    }


    if (isNaN(number)) return 0;


    if (
      unit === "k" ||
      unit === "nghìn" ||
      unit === "ngàn"
    ) {

      number *= 1000;

    }


    if (
      unit === "tr" ||
      unit === "triệu"
    ) {

      number *= 1000000;

    }


    return Math.round(number);

  }


  /* =========================
     CATEGORY
  ========================= */

  function getCategory(text) {

    const t =
      text
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );


    /* ĐI LẠI */

    if (
      /xang|do xang|dau xe|nhien lieu|petrol|grab|taxi|gojek|be\b|xe om|ship|giao hang|gui xe|bai xe|parking|cau duong|sua xe|bao duong xe|rua xe|oto|o to|xe may|xe buyt|bus/.test(t)
    ) {

      return "🚗 Đi lại";

    }


    /* ĂN UỐNG */

    if (
      /an sang|an trua|an toi|an vat|com|pho|bun|mi|my|chao|banh mi|do an|thuc an|ca phe|cafe|coffee|tra sua|nuoc uong|bia|quan an|nha hang|do uong/.test(t)
    ) {

      return "🍜 Ăn uống";

    }


    /* MUA SẮM */

    if (
      /mua sam|quan ao|ao\b|quan\b|giay|dep|tui|balo|my pham|son|dau goi|sua rua mat|sieu thi|hang hoa|do dung|dien thoai|phu kien/.test(t)
    ) {

      return "🛒 Mua sắm";

    }


    /* GIẢI TRÍ */

    if (
      /game|lien minh|lol|steam|netflix|youtube|phim|rap|karaoke|giai tri|spotify|nhac/.test(t)
    ) {

      return "🎮 Giải trí";

    }


    return "📦 Khác";

  }


  /* =========================
     ADD EXPENSE
  ========================= */

  function addExpense() {

    const input =
      document.getElementById(
        "expenseInput"
      );


    const text =
      input.value.trim();


    if (!text) {

      alert(
        "Vui lòng nhập khoản chi."
      );

      return;

    }


    const amount =
      parseAmount(text);


    if (!amount) {

      alert(
        "Không nhận diện được số tiền."
      );

      return;

    }


    const now =
      new Date();


    const expense = {

      id:
        Date.now(),

      text:
        text,

      amount:
        amount,

      category:
        getCategory(text),

      date:
        now.toISOString(),

      timestamp:
        now.getTime()

    };


    expenses.unshift(
      expense
    );


    saveData();


    input.value = "";


    render();

  }


  /* =========================
     SAVE
  ========================= */

  function saveData() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(expenses)
    );

  }


  /* =========================
     DELETE
  ========================= */

  function deleteExpense(id) {

    if (
      !confirm(
        "Bạn có chắc muốn xóa khoản chi này?"
      )
    ) {

      return;

    }


    expenses =
      expenses.filter(
        item =>
          item.id !== id
      );


    saveData();

    render();

  }


  /* =========================
     DATE HELPERS
  ========================= */

  function sameDay(
    date,
    now
  ) {

    return (
      date.getFullYear() ===
        now.getFullYear() &&

      date.getMonth() ===
        now.getMonth() &&

      date.getDate() ===
        now.getDate()
    );

  }


  function sameMonth(
    date,
    now
  ) {

    return (
      date.getFullYear() ===
        now.getFullYear() &&

      date.getMonth() ===
        now.getMonth()
    );

  }


  function sameYear(
    date,
    now
  ) {

    return (
      date.getFullYear() ===
      now.getFullYear()
    );

  }


  /* =========================
     RENDER
  ========================= */

  function render() {

    const now =
      new Date();


    let todayTotal = 0;

    let monthTotal = 0;

    let yearTotal = 0;


    expenses.forEach(
      item => {

        const date =
          new Date(
            item.date
          );


        if (
          sameDay(
            date,
            now
          )
        ) {

          todayTotal +=
            item.amount;

        }


        if (
          sameMonth(
            date,
            now
          )
        ) {

          monthTotal +=
            item.amount;

        }


        if (
          sameYear(
            date,
            now
          )
        ) {

          yearTotal +=
            item.amount;

        }

      }
    );


    document.getElementById(
      "todayTotal"
    ).textContent =
      formatMoney(
        todayTotal
      );


    document.getElementById(
      "monthTotal"
    ).textContent =
      formatMoney(
        monthTotal
      );


    document.getElementById(
      "yearTotal"
    ).textContent =
      formatMoney(
        yearTotal
      );


    document.getElementById(
      "budgetTotal"
    ).textContent =
      budget
        ? formatMoney(budget)
        : "Chưa đặt";


    /* SEARCH */

    const search =
      document.getElementById(
        "searchInput"
      ).value
        .trim()
        .toLowerCase();


    const filtered =
      expenses.filter(
        item => {

          return (
            item.text
              .toLowerCase()
              .includes(search) ||

            item.category
              .toLowerCase()
              .includes(search)
          );

        }
      );


    /* TABLE */

    const list =
      document.getElementById(
        "expenseList"
      );


    if (!filtered.length) {

      list.innerHTML = `
        <tr>
          <td
            colspan="5"
            class="empty">
            💤 Chưa có khoản chi
          </td>
        </tr>
      `;

      return;

    }


    list.innerHTML =
      filtered
        .map(
          item => {

            const date =
              new Date(
                item.date
              );


            const time =
              date.toLocaleTimeString(
                "vi-VN",
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              );


            return `
              <tr>

                <td>
                  ${escapeHTML(
                    item.text
                  )}
                </td>

                <td>
                  ${item.category}
                </td>

                <td class="amount">
                  ${formatMoney(
                    item.amount
                  )}
                </td>

                <td>
                  ${time}
                </td>

                <td>

                  <button
                    class="delete-btn"
                    onclick="deleteExpense(${item.id})">
                    🗑️
                  </button>

                </td>

              </tr>
            `;

          }
        )
        .join("");

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(
    text
  ) {

    return text
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================
     BUDGET
  ========================= */

  function saveBudget() {

    const value =
      Number(
        document.getElementById(
          "budgetInput"
        ).value
      );


    if (
      !value ||
      value < 0
    ) {

      alert(
        "Vui lòng nhập ngân sách hợp lệ."
      );

      return;

    }


    budget =
      value;


    localStorage.setItem(
      BUDGET_KEY,
      budget
    );


    render();


    alert(
      "Đã lưu ngân sách."
    );

  }


  /* =========================
     BACKUP
  ========================= */

  function backupData() {

    const data = {

      expenses:
        expenses,

      budget:
        budget,

      version:
        1,

      backupDate:
        new Date().toISOString()

    };


    const blob =
      new Blob(
        [
          JSON.stringify(
            data,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;

    a.download =
      "chi-tieu-backup.json";


    a.click();


    URL.revokeObjectURL(
      url
    );

  }


  /* =========================
     RESTORE
  ========================= */

  function restoreData(
    event
  ) {

    const file =
      event.target.files[0];


    if (!file) return;


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        try {

          const data =
            JSON.parse(
              e.target.result
            );


          if (
            !Array.isArray(
              data.expenses
            )
          ) {

            throw new Error();

          }


          if (
            !confirm(
              "Khôi phục dữ liệu sẽ thay thế dữ liệu hiện tại. Tiếp tục?"
            )
          ) {

            return;

          }


          expenses =
            data.expenses;


          budget =
            Number(
              data.budget || 0
            );


          saveData();


          localStorage.setItem(
            BUDGET_KEY,
            budget
          );


          render();


          alert(
            "Đã khôi phục dữ liệu."
          );

        }
        catch {

          alert(
            "File sao lưu không hợp lệ."
          );

        }

      };


    reader.readAsText(
      file
    );

  }


  /* =========================
     CSV
  ========================= */

  function exportCSV() {

    if (
      !expenses.length
    ) {

      alert(
        "Chưa có dữ liệu để xuất."
      );

      return;

    }


    let csv =
      "Khoan chi,Loai,So tien,Thoi gian\n";


    expenses.forEach(
      item => {

        const date =
          new Date(
            item.date
          );


        csv +=
          `"${item.text.replace(/"/g,'""')}","${item.category}",${item.amount},"${date.toLocaleString("vi-VN")}"\n`;

      }
    );


    const blob =
      new Blob(
        [
          "\uFEFF" +
          csv
        ],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;

    a.download =
      "chi-tieu.csv";


    a.click();


    URL.revokeObjectURL(
      url
    );

  }


  /* =========================
     DARK MODE
  ========================= */

  function toggleDarkMode() {

    document.body.classList.toggle(
      "dark"
    );


    localStorage.setItem(
      "chi_tieu_dark",
      document.body.classList.contains(
        "dark"
      )
        ? "1"
        : "0"
    );

  }


  if (
    localStorage.getItem(
      "chi_tieu_dark"
    ) === "1"
  ) {

    document.body.classList.add(
      "dark"
    );

  }


  /* =========================
     SETTINGS
  ========================= */

  function openSettings() {

    document.getElementById(
      "settingsModal"
    ).classList.add(
      "show"
    );


    document.getElementById(
      "budgetInput"
    ).value =
      budget || "";

  }


  function closeSettings() {

    document.getElementById(
      "settingsModal"
    ).classList.remove(
      "show"
    );

  }


  /* =========================
     NAVIGATION
  ========================= */

  function showDashboard() {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function showHistory() {

    document.querySelector(
      ".history"
    ).scrollIntoView({
      behavior: "smooth"
    });

  }


  /* =========================
     INITIALIZE
  ========================= */

  updateDate();

  render();


  /* Cập nhật ngày khi app được mở lâu */

  setInterval(
    updateDate,
    60000
  );


  /* =========================
     SERVICE WORKER
  ========================= */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "./sw.js"
          )
          .catch(
            error =>
              console.log(
                "SW error:",
                error
              )
          );

      }
    );

  }

</script>
