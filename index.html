<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Chi Tiêu V2</title>

  <link rel="apple-touch-icon" href="./icon-1024.PNG">
  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#111827">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body.dark {
      background: #111827;
      color: #f9fafb;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    body.dark .card {
      background: #1f2937;
      box-shadow: none;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
      color: #111827;
    }

    body.dark input {
      background: #374151;
      color: white;
      border-color: #4b5563;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary {
      background: #111827;
      color: white;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    body.dark .btn-secondary {
      background: #374151;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      text-align: center;
      padding: 12px 5px;
      background: #f9fafb;
      border-radius: 14px;
    }

    body.dark .stat {
      background: #374151;
    }

    .stat-title {
      font-size: 13px;
      opacity: 0.7;
    }

    .stat-value {
      font-size: 17px;
      font-weight: bold;
      margin-top: 5px;
    }

    .section-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .expense {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    body.dark .expense {
      border-color: #374151;
    }

    .expense:last-child {
      border-bottom: none;
    }

    .expense-left {
      min-width: 0;
    }

    .expense-note {
      font-weight: 600;
      word-break: break-word;
    }

    .expense-meta {
      font-size: 12px;
      opacity: 0.65;
      margin-top: 4px;
    }

    .expense-right {
      text-align: right;
      white-space: nowrap;
    }

    .amount {
      font-weight: bold;
    }

    .category {
      font-size: 12px;
      margin-top: 4px;
    }

    .delete-btn {
      margin-top: 5px;
      padding: 5px 8px;
      font-size: 12px;
      background: #fee2e2;
      color: #b91c1c;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .month-item,
    .year-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f9fafb;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    body.dark .month-item,
    body.dark .year-item {
      background: #374151;
    }

    .budget-bar {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    body.dark .budget-bar {
      background: #4b5563;
    }

    .budget-progress {
      height: 100%;
      width: 0%;
      background: #111827;
      transition: width 0.3s;
    }

    .empty {
      text-align: center;
      opacity: 0.6;
      padding: 15px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      max-width: 600px;
      max-height: 85vh;
      overflow: auto;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      padding: 18px;
    }

    body.dark .modal-content {
      background: #1f2937;
    }

    .close-btn {
      float: right;
      font-size: 20px;
      background: transparent;
    }

    .hint {
      font-size: 13px;
      opacity: 0.65;
      margin-top: 8px;
    }

    @media (max-width: 450px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .input-row {
        flex-direction: column;
      }

      .tools {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 Chi Tiêu</h1>

  <!-- NHẬP CHI TIÊU -->
  <div class="card">
    <div class="section-title">➕ Thêm khoản chi</div>

    <div class="input-row">
      <input
        id="expenseInput"
        type="text"
        placeholder="Ví dụ: 50k xăng"
        autocomplete="off"
      >

      <button class="btn-primary" onclick="addExpense()">
        Thêm
      </button>
    </div>

    <div class="hint">
      Ví dụ: 50k ăn sáng · 50.000 xăng · 1,5tr mua đồ · 2 triệu tiền nhà
    </div>
  </div>

  <!-- THỐNG KÊ -->
  <div class="card">
    <div class="section-title">📊 Tổng quan</div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">Hôm nay</div>
        <div class="stat-value" id="todayTotal">0đ</div>
      </div>

      <div class="stat">
        <div class="stat-title">Tháng này</div>
        <div class="stat-value" id="monthTotal">0đ</div>
      </div>

      <div class="stat">
        <div class="stat-title">Năm nay</div>
        <div class="stat-value" id="yearTotal">0đ</div>
      </div>

    </div>
  </div>

  <!-- NGÂN SÁCH -->
  <div class="card">
    <div class="section-title">🎯 Ngân sách tháng</div>

    <input
      id="budgetInput"
      type="number"
      placeholder="Nhập ngân sách tháng"
      onchange="saveBudget()"
    >

    <div class="budget-bar">
      <div class="budget-progress" id="budgetProgress"></div>
    </div>

    <div class="hint" id="budgetText">
      Chưa đặt ngân sách
    </div>
  </div>

  <!-- CÔNG CỤ -->
  <div class="card">
    <div class="section-title">🛠 Công cụ</div>

    <div class="tools">

      <button class="btn-secondary" onclick="toggleDarkMode()">
        🌙 Dark mode
      </button>

      <button class="btn-secondary" onclick="backupData()">
        💾 Sao lưu
      </button>

      <button class="btn-secondary" onclick="document.getElementById('restoreFile').click()">
        ♻️ Khôi phục
      </button>

      <button class="btn-secondary" onclick="exportCSV()">
        📊 Xuất CSV
      </button>

    </div>

    <input
      type="file"
      id="restoreFile"
      accept=".json"
      style="display:none"
      onchange="restoreData(event)"
    >
  </div>

  <!-- TÌM KIẾM -->
  <div class="card">
    <div class="section-title">🔎 Tìm kiếm</div>

    <input
      id="searchInput"
      type="text"
      placeholder="Tìm theo nội dung..."
      oninput="renderExpenses()"
    >
  </div>

  <!-- THEO THÁNG -->
  <div class="card">
    <div class="section-title">📅 Chi tiêu theo tháng</div>
    <div id="monthlyList"></div>
  </div>

  <!-- THEO NĂM -->
  <div class="card">
    <div class="section-title">📆 Chi tiêu theo năm</div>
    <div id="yearlyList"></div>
  </div>

  <!-- LỊCH SỬ -->
  <div class="card">
    <div class="section-title">🧾 Lịch sử chi tiêu</div>
    <div id="expenseList"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="monthModal">
  <div class="modal-content">

    <button class="close-btn" onclick="closeModal()">✕</button>

    <div class="section-title" id="modalTitle">
      Chi tiết tháng
    </div>

    <div id="modalExpenses"></div>

  </div>
</div>

<script>

const STORAGE_KEY = "chi_tieu_v1";
const BUDGET_KEY = "chi_tieu_budget";

let expenses = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);

let budget = Number(
  localStorage.getItem(BUDGET_KEY) || 0
);


// ===============================
// FORMAT TIỀN
// ===============================

function formatMoney(number) {

  return new Intl.NumberFormat("vi-VN").format(
    Math.round(number)
  ) + "đ";

}


// ===============================
// PARSE SỐ TIỀN
// ===============================

function parseAmount(text) {

  let match = text.match(
    /(\d+(?:[.,]\d+)?)\s*(k|nghìn|ngàn|tr|triệu|đ)?/i
  );

  if (!match) {
    return 0;
  }

  let numberText = match[1];
  let unit = (match[2] || "").toLowerCase();

  let number;

  /*
    Xử lý:

    50.000
    50,000
    50.000đ
    50k
    1.5tr
    1,5tr
  */

  if (
    !unit &&
    (
      /^\d{1,3}([.,]\d{3})+$/.test(numberText)
    )
  ) {

    number = Number(
      numberText.replace(/[.,]/g, "")
    );

  } else {

    number = Number(
      numberText.replace(",", ".")
    );

  }

  if (isNaN(number)) {
    return 0;
  }

  if (
    unit === "k" ||
    unit === "nghìn" ||
    unit === "ngàn"
  ) {

    number *= 1000;

  }

  if (
    unit === "tr" ||
    unit === "triệu"
  ) {

    number *= 1000000;

  }

  return Math.round(number);

}


// ===============================
// NHẬN DIỆN DANH MỤC
// ===============================

function getCategory(text) {

  const t = text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

  // 🚗 ĐI LẠI
  if (
    /xang|do xang|dau xe|nhien lieu|petrol|grab|taxi|gojek|be\b|xe om|ship|giao hang|gui xe|bai xe|parking|cau duong|sua xe|bao duong xe|rua xe|oto|o to|xe may|xe buyt|bus/.test(t)
  ) {
    return "🚗 Đi lại";
  }

  // 🍜 ĂN UỐNG
  if (
    /an sang|an trua|an toi|an vat|com|pho|bun|mi|my|chao|banh mi|do an|thuc an|ca phe|cafe|coffee|tra sua|nuoc uong|bia|quan an|nha hang|do uong/.test(t)
  ) {
    return "🍜 Ăn uống";
  }

  // 🛒 MUA SẮM
  if (
    /mua sam|quan ao|ao\b|quan\b|giay|dep|tui|balo|my pham|son|dau goi|sua rua mat|sieu thi|hang hoa|do dung|dien thoai|phu kien/.test(t)
  ) {
    return "🛒 Mua sắm";
  }

  // 🎮 GIẢI TRÍ
  if (
    /game|lien minh|lol|steam|netflix|youtube|phim|rap|karaoke|giai tri|spotify|nhac/.test(t)
  ) {
    return "🎮 Giải trí";
  }

  // 📦 KHÁC
  return "📦 Khác";
}


// ===============================
// THÊM CHI TIÊU
// ===============================

function addExpense() {

  const input = document.getElementById("expenseInput");

  const text = input.value.trim();

  if (!text) {
    alert("Vui lòng nhập khoản chi.");
    return;
  }

  const amount = parseAmount(text);

  if (!amount) {
    alert("Không nhận diện được số tiền.");
    return;
  }

  const expense = {

    id: Date.now(),

    text: text,

    amount: amount,

    category: getCategory(text),

    date: new Date().toISOString()

  };

  expenses.unshift(expense);

  saveExpenses();

  input.value = "";

  renderAll();

}


// ===============================
// LƯU DỮ LIỆU
// ===============================

function saveExpenses() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(expenses)
  );

}


// ===============================
// NGÀY
// ===============================

function dateKey(date) {

  const d = new Date(date);

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(d.getDate()).padStart(2, "0")
  );

}


function monthKey(date) {

  const d = new Date(date);

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2, "0")
  );

}


function yearKey(date) {

  return new Date(date)
    .getFullYear()
    .toString();

}


// ===============================
// TỔNG HỢP
// ===============================

function getTotal(list) {

  return list.reduce(
    (sum, item) => sum + Number(item.amount || 0),
    0
  );

}


// ===============================
// RENDER TỔNG
// ===============================

function renderStats() {

  const now = new Date();

  const today = dateKey(now);

  const month = monthKey(now);

  const year = yearKey(now);

  const todayTotal = getTotal(
    expenses.filter(e => dateKey(e.date) === today)
  );

  const monthTotal = getTotal(
    expenses.filter(e => monthKey(e.date) === month)
  );

  const yearTotal = getTotal(
    expenses.filter(e => yearKey(e.date) === year)
  );

  document.getElementById("todayTotal").textContent =
    formatMoney(todayTotal);

  document.getElementById("monthTotal").textContent =
    formatMoney(monthTotal);

  document.getElementById("yearTotal").textContent =
    formatMoney(yearTotal);

  renderBudget(monthTotal);

}


// ===============================
// NGÂN SÁCH
// ===============================

function saveBudget() {

  budget = Number(
    document.getElementById("budgetInput").value || 0
  );

  localStorage.setItem(
    BUDGET_KEY,
    budget
  );

  renderStats();

}


function renderBudget(monthTotal) {

  const progress =
    document.getElementById("budgetProgress");

  const text =
    document.getElementById("budgetText");

  if (!budget) {

    progress.style.width = "0%";

    text.textContent =
      "Chưa đặt ngân sách";

    return;

  }

  const percent =
    Math.min(
      100,
      (monthTotal / budget) * 100
    );

  progress.style.width =
    percent + "%";

  const remaining =
    budget - monthTotal;

  if (remaining >= 0) {

    text.textContent =
      "Còn " + formatMoney(remaining) +
      " trong ngân sách tháng.";

  } else {

    text.textContent =
      "⚠️ Đã vượt ngân sách " +
      formatMoney(Math.abs(remaining)) +
      ".";

  }

}


// ===============================
// LỊCH SỬ
// ===============================

function renderExpenses() {

  const container =
    document.getElementById("expenseList");

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  let list = expenses;

  if (search) {

    list = expenses.filter(e =>
      e.text.toLowerCase().includes(search) ||
      e.category.toLowerCase().includes(search)
    );

  }

  if (!list.length) {

    container.innerHTML =
      '<div class="empty">Chưa có khoản chi nào.</div>';

    return;

  }

  container.innerHTML =
    list.map(e => {

      const d = new Date(e.date);

      return `
        <div class="expense">

          <div class="expense-left">

            <div class="expense-note">
              ${escapeHTML(e.text)}
            </div>

            <div class="expense-meta">
              ${d.toLocaleDateString("vi-VN")}
              ${d.toLocaleTimeString("vi-VN", {
                hour: "2-digit",
                minute: "2-digit"
              })}
            </div>

          </div>

          <div class="expense-right">

            <div class="amount">
              ${formatMoney(e.amount)}
            </div>

            <div class="category">
              ${e.category}
            </div>

            <button
              class="delete-btn"
              onclick="deleteExpense(${e.id})"
            >
              Xóa
            </button>

          </div>

        </div>
      `;

    }).join("");

}


// ===============================
// XÓA
// ===============================

function deleteExpense(id) {

  if (!confirm("Bạn có chắc muốn xóa khoản này?")) {
    return;
  }

  expenses =
    expenses.filter(e => e.id !== id);

  saveExpenses();

  renderAll();

}


// ===============================
// THEO THÁNG
// ===============================

function renderMonthly() {

  const container =
    document.getElementById("monthlyList");

  const groups = {};

  expenses.forEach(e => {

    const key = monthKey(e.date);

    if (!groups[key]) {
      groups[key] = 0;
    }

    groups[key] += Number(e.amount);

  });

  const keys =
    Object.keys(groups).sort().reverse();

  if (!keys.length) {

    container.innerHTML =
      '<div class="empty">Chưa có dữ liệu.</div>';

    return;

  }

  container.innerHTML =
    keys.map(key => {

      const [year, month] =
        key.split("-");

      return `
        <div
          class="month-item"
          onclick="showMonth('${key}')"
          style="cursor:pointer"
        >

          <div>
            📅 Tháng ${month}/${year}
          </div>

          <strong>
            ${formatMoney(groups[key])}
          </strong>

        </div>
      `;

    }).join("");

}


// ===============================
// THEO NĂM
// ===============================

function renderYearly() {

  const container =
    document.getElementById("yearlyList");

  const groups = {};

  expenses.forEach(e => {

    const key = yearKey(e.date);

    if (!groups[key]) {
      groups[key] = 0;
    }

    groups[key] += Number(e.amount);

  });

  const keys =
    Object.keys(groups).sort().reverse();

  if (!keys.length) {

    container.innerHTML =
      '<div class="empty">Chưa có dữ liệu.</div>';

    return;

  }

  container.innerHTML =
    keys.map(year => {

      return `
        <div class="year-item">

          <div>
            📆 Năm ${year}
          </div>

          <strong>
            ${formatMoney(groups[year])}
          </strong>

        </div>
      `;

    }).join("");

}


// ===============================
// MODAL THÁNG
// ===============================

function showMonth(key) {

  const list =
    expenses.filter(
      e => monthKey(e.date) === key
    );

  const [year, month] =
    key.split("-");

  document.getElementById("modalTitle")
    .textContent =
    `📅 Chi tiết tháng ${month}/${year}`;

  const container =
    document.getElementById("modalExpenses");

  if (!list.length) {

    container.innerHTML =
      '<div class="empty">Không có dữ liệu.</div>';

  } else {

    container.innerHTML =
      list.map(e => {

        const d =
          new Date(e.date);

        return `
          <div class="expense">

            <div class="expense-left">

              <div class="expense-note">
                ${escapeHTML(e.text)}
              </div>

              <div class="expense-meta">
                ${d.toLocaleDateString("vi-VN")}
              </div>

            </div>

            <div class="expense-right">

              <div class="amount">
                ${formatMoney(e.amount)}
              </div>

              <div class="category">
                ${e.category}
              </div>

            </div>

          </div>
        `;

      }).join("");

  }

  document.getElementById("monthModal")
    .style.display = "block";

}


function closeModal() {

  document.getElementById("monthModal")
    .style.display = "none";

}


// ===============================
// SAO LƯU
// ===============================

function backupData() {

  const data = {

    version: 2,

    expenses: expenses,

    budget: budget,

    backupDate:
      new Date().toISOString()

  };

  const blob =
    new Blob(
      [JSON.stringify(data, null, 2)],
      {
        type: "application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "chi-tieu-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}


// ===============================
// KHÔI PHỤC
// ===============================

function restoreData(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    try {

      const data =
        JSON.parse(e.target.result);

      if (
        !data.expenses ||
        !Array.isArray(data.expenses)
      ) {

        throw new Error(
          "File không hợp lệ"
        );

      }

      if (
        !confirm(
          "Khôi phục dữ liệu sẽ thay thế dữ liệu hiện tại. Tiếp tục?"
        )
      ) {

        return;

      }

      expenses =
        data.expenses;

      budget =
        Number(data.budget || 0);

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(expenses)
      );

      localStorage.setItem(
        BUDGET_KEY,
        budget
      );

      document.getElementById(
        "budgetInput"
      ).value = budget || "";

      renderAll();

      alert("Khôi phục thành công!");

    } catch (error) {

      alert(
        "Không thể khôi phục file."
      );

    }

  };

  reader.readAsText(file);

}


// ===============================
// CSV
// ===============================

function exportCSV() {

  let csv =
    "Ngày,Giờ,Nội dung,Số tiền,Danh mục\n";

  expenses.forEach(e => {

    const d =
      new Date(e.date);

    const date =
      d.toLocaleDateString("vi-VN");

    const time =
      d.toLocaleTimeString("vi-VN");

    const text =
      `"${String(e.text).replace(/"/g, '""')}"`;

    const category =
      `"${String(e.category).replace(/"/g, '""')}"`;

    csv +=
      `"${date}","${time}",${text},${e.amount},${category}\n`;

  });

  const blob =
    new Blob(
      ["\uFEFF" + csv],
      {
        type: "text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "chi-tieu.csv";

  a.click();

  URL.revokeObjectURL(url);

}


// ===============================
// DARK MODE
// ===============================

function toggleDarkMode() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "chi_tieu_dark",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );

}


// ===============================
// ESCAPE HTML
// ===============================

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// ===============================
// RENDER TẤT CẢ
// ===============================

function renderAll() {

  renderStats();

  renderExpenses();

  renderMonthly();

  renderYearly();

}


// ===============================
// KHỞI ĐỘNG
// ===============================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    if (
      localStorage.getItem(
        "chi_tieu_dark"
      ) === "1"
    ) {

      document.body.classList.add("dark");

    }

    document.getElementById(
      "budgetInput"
    ).value = budget || "";

    renderAll();

    document.getElementById(
      "expenseInput"
    ).addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          addExpense();
        }

      }
    );

  }
);

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(error) {
          console.log(

  );
