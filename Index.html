<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Chi Tiêu</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f4f5f7;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif
}
main{
  max-width:520px;margin:auto;
  padding:env(safe-area-inset-top) 16px 30px
}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 0 12px
}
h1{margin:0;font-size:29px}
.month{font-size:13px;color:#6b7280;margin-top:3px}
.card{
  background:#111827;color:white;border-radius:22px;
  padding:20px;margin-bottom:14px
}
.small{font-size:12px;color:#cbd5e1}
.total{font-size:35px;font-weight:750;margin:3px 0 14px}
.row{display:flex;justify-content:space-between;color:#d1d5db;font-size:14px}
.box{
  background:white;border-radius:18px;padding:12px;
  box-shadow:0 2px 12px #0000000b
}
.input{display:flex;gap:8px}
.input input{
  flex:1;border:0;outline:0;font-size:17px;padding:9px
}
button{
  border:0;border-radius:13px;background:#111827;
  color:#fff;padding:11px 14px;font-weight:650
}
.quick{
  display:flex;gap:7px;overflow:auto;margin-top:8px
}
.quick button{
  background:#e5e7eb;color:#111827;
  white-space:nowrap;font-size:12px
}
h2{font-size:18px;margin:20px 2px 9px}
.item{
  display:flex;align-items:center;gap:11px;
  background:#fff;border-radius:16px;padding:12px;margin:7px 0
}
.ico{
  width:42px;height:42px;border-radius:13px;
  background:#f1f5f9;display:grid;place-items:center;font-size:20px
}
.info{flex:1}
.desc{font-weight:650}
.meta{font-size:11px;color:#6b7280;margin-top:3px}
.amt{font-weight:700}
.empty{
  text-align:center;color:#9ca3af;background:#fff;
  border-radius:16px;padding:25px
}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>💰 Chi tiêu</h1>
    <div class="month" id="month"></div>
  </div>
  <button onclick="wipe()">Xóa</button>
</header>
<section class="card">
  <div class="small">TỔNG THÁNG NÀY</div>
  <div class="total" id="total">0đ</div>
  <div class="row">
    <span>Hôm nay</span>
    <b id="today">0đ</b>
  </div>
</section>
<section class="box">
  <div class="input">
    <input
      id="entry"
      placeholder="Ví dụ: 50k ăn sáng"
      autocomplete="off"
    >
    <button onclick="add()">Thêm</button>
  </div>
  <div class="quick">
    <button onclick="fill('50k ăn sáng')">50k ăn sáng</button>
    <button onclick="fill('100k xăng')">100k xăng</button>
    <button onclick="fill('35k cà phê')">35k cà phê</button>
    <button onclick="fill('1.5tr mua đồ')">1.5tr mua đồ</button>
  </div>
</section>
<h2>📋 Giao dịch gần đây</h2>
<div id="list"></div>
</main>
<script>
const KEY = "chi_tieu_v1";
let db = JSON.parse(
  localStorage.getItem(KEY) || "[]"
);
const fmt = n =>
  new Intl.NumberFormat("vi-VN").format(n) + "đ";
function fill(value){
  entry.value = value;
  entry.focus();
}
function parse(text){
  /*
    Hỗ trợ:
    50k ăn sáng
    50.000 ăn sáng
    1.5tr mua đồ
    2 triệu tiền nhà
  */
  let s = text.toLowerCase().trim();
  let m = s.match(
    /(\d+(?:[.,]\d+)?)\s*(k|nghìn|ngàn|tr|triệu|đ)?/i
  );
  if(!m) return null;
  let number =
    parseFloat(
      m[1].replace(",", ".")
    );
  let unit =
    (m[2] || "đ").toLowerCase();
  if(
    unit === "k" ||
    unit === "nghìn" ||
    unit === "ngàn"
  ){
    number *= 1000;
  }
  if(
    unit === "tr" ||
    unit === "triệu"
  ){
    number *= 1000000;
  }
  let desc =
    s.replace(m[0], "").trim();
  if(!desc)
    desc = "Chi tiêu";
  let category = "Khác";
  let icon = "📦";
  if(
    /ăn|cơm|phở|bún|mì|cà phê|cafe|trà|uống|nhậu/
    .test(desc)
  ){
    category = "Ăn uống";
    icon = "🍜";
  }
  else if(
    /xăng|taxi|grab|xe|đi lại|gửi xe/
    .test(desc)
  ){
    category = "Đi lại";
    icon = "🚗";
  }
  else if(
    /mua|shop|quần|áo|giày|đồ/
    .test(desc)
  ){
    category = "Mua sắm";
    icon = "🛒";
  }
  else if(
    /game|phim|du lịch|giải trí/
    .test(desc)
  ){
    category = "Giải trí";
    icon = "🎮";
  }
  return {
    amount: Math.round(number),
    desc: desc,
    category: category,
    icon: icon,
    date: new Date().toISOString()
  };
}
function add(){
  let item = parse(entry.value);
  if(!item){
    alert(
      "Hãy nhập ví dụ:\n\n50k ăn sáng\n100k xăng\n1.5tr mua đồ"
    );
    return;
  }
  db.unshift(item);
  save();
  entry.value = "";
  render();
}
function save(){
  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );
}
function removeItem(index){
  if(!confirm("Xóa khoản chi này?"))
    return;
  db.splice(index,1);
  save();
  render();
}
function wipe(){
  if(!confirm(
    "Bạn có chắc muốn xóa toàn bộ dữ liệu?"
  ))
    return;
  db = [];
  save();
  render();
}
function escapeHTML(text){
  return text.replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}
function render(){
  const now = new Date();
  const ym =
    now.toISOString().slice(0,7);
  const day =
    now.toISOString().slice(0,10);
  const monthData =
    db.filter(
      x => x.date.slice(0,7) === ym
    );
  const todayData =
    monthData.filter(
      x => x.date.slice(0,10) === day
    );
  const monthTotal =
    monthData.reduce(
      (sum,x) => sum + x.amount,
      0
    );
  const todayTotal =
    todayData.reduce(
      (sum,x) => sum + x.amount,
      0
    );
  document.getElementById("total")
    .textContent = fmt(monthTotal);
  document.getElementById("today")
    .textContent = fmt(todayTotal);
  document.getElementById("month")
    .textContent =
      now.toLocaleDateString(
        "vi-VN",
        {
          month:"long",
          year:"numeric"
        }
      );
  const list =
    document.getElementById("list");
  if(monthData.length === 0){
    list.innerHTML =
      '<div class="empty">' +
      'Chưa có khoản chi nào.' +
      '</div>';
    return;
  }
  list.innerHTML =
    monthData.slice(0,50)
    .map((x,index) => {
      const date =
        new Date(x.date)
        .toLocaleString("vi-VN");
      return `
        <div class="item">
          <div class="ico">
            ${x.icon}
          </div>
          <div class="info">
            <div class="desc">
              ${escapeHTML(x.desc)}
            </div>
            <div class="meta">
              ${x.category} · ${date}
            </div>
          </div>
          <div class="amt">
            ${fmt(x.amount)}
          </div>
          <button
            style="
              padding:7px 9px;
              background:#fee2e2;
              color:#991b1b;
            "
            onclick="removeItem(${index})"
          >
            ×
          </button>
        </div>
      `;
    })
    .join("");
}
entry.addEventListener(
  "keydown",
  function(e){
    if(e.key === "Enter")
      add();
  }
);
render();
if("serviceWorker" in navigator){
  window.addEventListener(
    "load",
    () => {
      navigator.serviceWorker
        .register("sw.js")
        .catch(()=>{});
    }
  );
}
</script>
</body>
</html>
